<!DOCTYPE html>
<html>

<head>
    <title>WebSocket Test</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .container {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin: 10px 0;
        }

        input,
        button {
            padding: 10px;
            margin: 5px;
            font-size: 14px;
        }

        .log {
            background: #000;
            color: #0f0;
            padding: 15px;
            font-family: monospace;
            height: 400px;
            overflow-y: auto;
        }

        .connected {
            color: green;
            font-weight: bold;
        }

        .disconnected {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>🔌 WebSocket Test Client</h1>

    <!-- Connection -->
    <div class="container">
        <h3>Connection</h3>
        <input type="text" id="serverUrl" value="http://localhost:6000" placeholder="Server URL" style="width: 300px;">
        <input type="text" id="token" placeholder="JWT Token" style="width: 400px;">
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
        <div>Status: <span id="status" class="disconnected">Disconnected</span></div>
    </div>

    <!-- Send Ping -->
    <div class="container">
        <h3>Test Connection</h3>
        <button onclick="sendPing()">Send Ping</button>
    </div>

    <!-- Console Log -->
    <div class="container">
        <h3>Console Log</h3>
        <div id="log" class="log"></div>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <script>
        let socket = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#f00' : type === 'success' ? '#0f0' : '#fff';
            logDiv.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function connect() {
            const serverUrl = document.getElementById('serverUrl').value;
            const token = document.getElementById('token').value;

            log('🔌 Connecting to ' + serverUrl + '...', 'info');

            socket = io(serverUrl, {
                auth: { token },
                transports: ['websocket', 'polling'],
                reconnection: true,
            });

            socket.on('connect', () => {
                log('✅ Connected! Socket ID: ' + socket.id, 'success');
                document.getElementById('status').textContent = 'Connected';
                document.getElementById('status').className = 'connected';
            });

            socket.on('disconnect', (reason) => {
                log('❌ Disconnected: ' + reason, 'error');
                document.getElementById('status').textContent = 'Disconnected';
                document.getElementById('status').className = 'disconnected';
            });

            socket.on('connect_error', (error) => {
                log('🔥 Connection Error: ' + error.message, 'error');
            });

            socket.on('notification', (data) => {
                log('📬 Received notification: ' + JSON.stringify(data, null, 2), 'success');
            });

            socket.on('admin_notification', (data) => {
                log('👨‍💼 Received admin notification: ' + JSON.stringify(data, null, 2), 'success');
            });

            socket.on('pong', () => {
                log('🏓 Received pong', 'success');
            });
        }

        function disconnect() {
            if (socket) {
                socket.disconnect();
                log('🔌 Disconnected manually', 'info');
            }
        }

        function sendPing() {
            if (socket && socket.connected) {
                socket.emit('ping');
                log('🏓 Sent ping', 'info');
            } else {
                log('❌ Not connected', 'error');
            }
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
    </script>
</body>

</html>
