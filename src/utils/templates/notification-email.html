<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notification</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f4;
        color: #333;
      }
      .container {
        max-width: 600px;
        margin: 20px auto;
        padding: 20px;
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .header {
        text-align: center;
        margin-bottom: 20px;
        padding-bottom: 20px;
        border-bottom: 2px solid #00b517;
      }
      .header h1 {
        color: #1c2b2d;
        margin: 0;
        font-size: 24px;
      }
      .content {
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 30px;
      }
      .notification-title {
        font-size: 20px;
        font-weight: bold;
        color: #1c2b2d;
        margin-bottom: 15px;
      }
      .notification-message {
        color: #555;
        margin-bottom: 20px;
      }
      .button-container {
        text-align: center;
        margin: 30px 0;
      }
      .button {
        display: inline-block;
        padding: 14px 28px;
        background: linear-gradient(135deg, #00b517 0%, #009914 100%);
        color: #ffffff;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 16px;
        transition: background 0.3s;
      }
      .button:hover {
        background: linear-gradient(135deg, #009914 0%, #007a10 100%);
      }
      .footer {
        text-align: center;
        font-size: 14px;
        color: #888;
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #e0e0e0;
      }
      .footer a {
        color: #00b517;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>St-Caël</h1>
      </div>
      <div class="content">
        <div class="notification-title">{{title}}</div>
        <div class="notification-message">{{message}}</div>
        {{linkButton}}
      </div>
      <div class="footer">
        <p>You received this email because you have an account with St-Caël.</p>
        <p>
          <a href="{{frontendUrl}}/profile">Manage Notifications</a> | 
          <a href="{{frontendUrl}}">Visit Website</a>
        </p>
      </div>
    </div>
  </body>
</html>
