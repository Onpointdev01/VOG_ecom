<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Reset</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f4;
        color: #333;
      }
      .container {
        max-width: 600px;
        margin: 20px auto;
        padding: 20px;
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .header {
        text-align: center;
        margin-bottom: 20px;
      }
      .header img {
        width: 100px;
        height: auto;
      }
      .content {
        font-size: 16px;
        line-height: 1.5;
        margin-bottom: 20px;
      }
      .code {
        text-align: center;
        font-size: 24px;
        background: #f1f1f1;
        padding: 15px;
        border-radius: 5px;
        margin: 20px 0;
        font-weight: bold;
      }
      .footer {
        text-align: center;
        font-size: 14px;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img src="https://via.placeholder.com/100" alt="Company Logo" />
        <h1>Password Reset Request</h1>
      </div>
      <div class="content">
        <p>Hi {{user}},</p>
        <p>You requested to reset your password. Please use the following verification code:</p>
        <div class="code">{{code}}</div>
        <p>This code will expire in 10 minutes. If you did not request this, please ignore this email.</p>
      </div>
      <div class="footer">
        <p>If you have any questions, please contact our support team.</p>
      </div>
    </div>
  </body>
</html>
